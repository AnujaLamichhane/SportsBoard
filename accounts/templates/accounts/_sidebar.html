<aside style="width: 280px; background: var(--nav-bg); padding: 2.5rem 1.5rem; border-right: 1px solid rgba(128,128,128,0.9); display: flex; flex-direction: column; min-height: 100vh; flex-shrink: 0;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
        <div style="position: relative; display: inline-block;">
            <img src="{{ request.user.profile.profile_url }}" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent-color); padding: 3px; background: var(--bg-color);">
            <div style="position: absolute; bottom: 5px; right: 5px; width: 18px; height: 18px; background: #28a745; border-radius: 50%; border: 3px solid var(--nav-bg);"></div>
        </div>
        <h3 style="margin-top: 25px; color: var(--text-color); font-size: 1.2rem; font-weight: 700;">{{ user.username }}</h3>
        <p style="font-size: 0.8rem; color: var(--accent-color); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px;">Athlete Account</p>
        <a href="{% url 'accounts:edit_profile' %}" 
            class="mt-3 inline-block px-4 py-1 text-sm font-medium border border-orange-500 rounded-full transition duration-300 
            {% if 'edit-profile' in request.path %} bg-orange-500 text-white {% else %} text-orange-500 hover:bg-orange-500 hover:text-white {% endif %}">
                Edit Profile
        </a>
    </div>

    <nav style="display: flex; flex-direction: column; gap: 8px;">
        <a href="{% url 'accounts:user_dashboard' %}" 
            class="nav-link {% if request.resolver_match.url_name == 'user_dashboard' %}active{% endif %}">
            <span style="font-size: 1.1rem;">🏠</span>
            <span> Overview</span>
        </a>
        <a href="{% url 'accounts:available_trials' %}" class="nav-link {% if request.resolver_match.url_name == 'available_trials' %}active{% endif %}">
            <i class="fas fa-list me-2"></i> Available Trials
            
        </a>
        <a href="{% url 'accounts:my_trials' %}" 
            class="nav-link {% if request.resolver_match.url_name == 'my_trials' %}active{% endif %}">
                        <span style="font-size: 1.1rem;">🏅</span> 
            <span>My Trials</span>
        </a>
        <!-- <a href="#" class="nav-link">
            <span style="font-size: 1.1rem;">⚙️</span> 
            <span>Settings</span>
        </a> -->
    </nav>
</aside>
