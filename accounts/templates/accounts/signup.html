{% extends "accounts/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up | SportsBoard{% endblock %}

{% block content %}
<div class="login-card">

    <h3 class="text-center mb-3">Create Your Account</h3>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
         <button type="submit" class="btn btn-primary btn-block mt-3">Sign Up</button>
    </form>
    <p class="text-center mt-3 text-light">
        Already have an account? <a href="{% url 'login' %}" class="text-primary">Login</a>
    </p>
</div>
{% endblock %}
