{% extends "accounts/base.html" %}
{% load i18n %}

{% block title %}Password Reset Complete | SportsBoard{% endblock %}

{% block content %}
<h3 class="login-title">{% trans "Password Changed" %}</h3>

<p class="text-muted mb-3">
    {% trans "Your password has been set. You may now log in with the new password." %}
</p>

<p class="text-center mt-3">
    <a href="{% url 'account_login' %}" class="btn btn-primary">{% trans "Log in" %}</a>
</p>
{% endblock %}
