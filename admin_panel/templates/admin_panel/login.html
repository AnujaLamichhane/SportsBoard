{% extends 'homepage/base.html' %}
{% load static %}

{% block title %}Admin Login | SportsBoard{% endblock %}

{% block extra_css %}
<style>
    /* Centers the card within the main content area provided by base.html */
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh; /* Adjusts based on nav/footer height */
    }
    .card { 
        background: white; 
        padding: 2.5rem; 
        border-radius: 12px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        text-align: center; 
        width: 100%;
        max-width: 400px;
        color: #333;
    }
    .hidden { display: none; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    .btn-login { width: 100%; cursor: pointer; padding: 12px; border: none; border-radius: 6px; background-color: #007bff; color: white; font-weight: 600; transition: 0.3s; }
    .btn-login:hover { background-color: #0056b3; }
    #lockBtn { background-color: #343a40; font-size: 1.1rem; padding: 15px 30px; }
    .error { color: #dc3545; font-size: 0.9rem; margin-bottom: 15px; font-weight: 500; }
    h2 { margin-bottom: 1.5rem; color: #212529; }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card">
        <div id="lockContainer">
            <i class="fa-solid fa-user-shield fa-3x mb-3 text-dark"></i>
            <h2>Restricted Area</h2>
            <p class="text-muted mb-4">Authorized Personnel Only</p>
            <button id="lockBtn" class="btn-login" onclick="showLogin()">
                <i class="fa-solid fa-lock-open me-2"></i> Open Admin Login
            </button>
        </div>

        <div id="loginContainer" class="hidden">
            <i class="fa-solid fa-shield-halved fa-3x mb-3 text-primary"></i>
            <h2>Admin Verification</h2>
            <div id="errorMessage" class="error"></div>
            
            <input type="text" id="username" placeholder="Username" autocomplete="off">
            <input type="password" id="password" placeholder="Password">
            
            <button class="btn-login" onclick="handleLogin()">
                Access Dashboard
            </button>
            <p class="mt-3"><a href="#" onclick="location.reload()" class="text-decoration-none text-muted small">Go Back</a></p>
        </div>
    </div>
</div>
<script>
    function showLogin() {
        document.getElementById('lockContainer').classList.add('hidden');
        document.getElementById('loginContainer').classList.remove('hidden');
    }

    function handleLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMessage');

        if (user === 'Admin' && pass === 'Admin') {
            // STEP 1: Save the session flag (This was missing!)
            sessionStorage.setItem('isAdminLoggedIn', 'true');
            
            // STEP 2: Redirect to the dashboard
            window.location.href = "{% url 'admin_panel:adashboard' %}";
        } else {
            errorMsg.innerText = "Invalid Admin credentials. Access Denied.";
        }
    }

    // Optional: Allow "Enter" key to trigger login
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });
</script>
{% endblock %}
