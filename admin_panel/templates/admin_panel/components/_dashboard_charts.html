<div class="row g-4 mb-5">
    <div class="col-lg-6">
        <div class="chart-card shadow-sm p-4">
            <h5 class="fw-bold mb-4">Events by Sport</h5>
            <div class="chart-container" style="position: relative; height:300px;">
                <canvas id="eventsBarChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-lg-6">
        <!-- <div class="chart-card shadow-sm p-4">
            <h5 class="fw-bold mb-4">User Registration (Last 30 Days)</h5>
            <div class="chart-container" style="position: relative; height:300px;">
                <canvas id="userGrowthChart"></canvas>
            </div>
        </div> -->
        <div class="growth-chart-container shadow-sm p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">User Registration Growth</h5>
                <select class="form-select form-select-sm w-auto">
                    <option>Last 30 Days</option>
                    <option>Last 6 Months</option>
                </select>
            </div>
            <div class="chart-wrapper" style="height: 300px;">
                <canvas id="userGrowthChart"></canvas>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
    // --- 1. BAR CHART: Events per Sport ---
    const ctxBar = document.getElementById('eventsBarChart').getContext('2d');
    new Chart(ctxBar, {
        type: 'bar',
        data: {
            labels: ['Cricket', 'Football', 'Volleyball', 'Badminton', 'Futsal'],
            datasets: [{
                label: 'Number of Events',
                data: [45, 62, 28, 15, 34],
                backgroundColor: '#ff8900', // Your primary orange
                borderRadius: 8,
                barThickness: 30
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    });

    // --- 2. LINE CHART: User Growth ---
    const ctxLine = document.getElementById('userGrowthChart').getContext('2d');
    new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
            datasets: [{
                label: 'New Users',
                data: [150, 230, 180, 310],
                borderColor: '#007bff',
                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                fill: true,
                tension: 0.4,
                pointRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: '#f0f0f0' } },
                x: { grid: { display: false } }
            }
        }
    });
});
</script>
