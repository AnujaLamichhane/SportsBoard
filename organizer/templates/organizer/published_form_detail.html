{% extends "sidebar.html" %}

{% block content %}
<div class="dashboard-body" style="background-color: #0d0e10; min-height: 100vh; padding: 2rem;">
    <div class="mb-4 d-flex align-items-center">
        <div style="background-color: #6c757d; color: #000; padding: 6px 24px; border-radius: 50px; font-weight: 800; text-transform: uppercase; font-size: 0.9rem;">
            Event Details
        </div>
        <div class="flex-grow-1 ms-3" style="height: 1px; background-color: #333;"></div>
    </div>

    <div class="container-fluid px-0">
        <div class="row g-4">
            <div class="col-md-6">
                <label class="text-white fw-bold mb-2">Event name<span class="text-danger">*</span></label>
                <div class="form-control bg-white text-dark py-2" style="border-radius: 10px; min-height: 45px; border: none; display: flex; align-items: center;">
                    {{ form_data.event_name }}
                </div>
            </div>
            
            <div class="col-md-6">
                <label class="text-white fw-bold mb-2">Sports<span class="text-danger">*</span></label>
                <div class="form-control bg-white text-dark py-2" style="border-radius: 10px; min-height: 45px; border: none; display: flex; align-items: center;">
                    {{ form_data.sports }}
                </div>
            </div>

            <div class="col-md-6">
                <label class="text-white fw-bold mb-2">Level<span class="text-danger">*</span></label>
                <div class="form-control bg-white text-dark py-2" style="border-radius: 10px; min-height: 45px; border: none; display: flex; align-items: center;">
                    {{ form_data.level|default:"None" }}
                </div>
            </div>

            <div class="col-md-6">
                <label class="text-white fw-bold mb-2">Address<span class="text-danger">*</span></label>
                <div class="form-control bg-white text-dark py-2" style="border-radius: 10px; min-height: 45px; border: none; display: flex; align-items: center;">
                    {{ form_data.address }}
                </div>
            </div>
        </div>

        <div class="mt-5">
            <a href="{% url 'organizer:published_forms' %}" class="btn btn-outline-secondary text-white border-secondary">
                <i class="fas fa-arrow-left me-2"></i> Back to List
            </a>
        </div>
    </div>
</div>
{% endblock %}
