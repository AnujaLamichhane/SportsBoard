{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Successful!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'organizer/css/dashboard.css' %}">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5 text-center">
        <div class="card bg-dark-card p-5 border-0 shadow-lg mx-auto" style="max-width: 500px;">
            <div class="mb-4">
                <i class="fas fa-check-circle text-success fa-4x"></i>
            </div>
            <h2 class="text-warning">Booking Confirmed!</h2>
            <p class="text-white">Please save this ticket for entry to the venue.</p>

            <div class="bg-white p-3 rounded mb-4 d-inline-block">
                <div id="qrcode"></div>
            </div>

            <div class="text-start border-top border-secondary pt-3 mt-3 text-dark-card">
                <p class="mb-1 text-white"><strong>Event:</strong> {{ sale.event.name }}</p>
                <p class="mb-1 text-white"><strong>Tier:</strong> {{ sale.ticket_type.name }}</p>
                <p class="mb-1 text-white"><strong>Ticket Code:</strong> <span class="text-info">{{ sale.ticket_code }}</span></p>
            </div>

            <div class="mt-4 no-print">
                <button onclick="window.print()" class="btn btn-outline-light me-2">
                    <i class="fas fa-print me-2"></i>Print Ticket
                </button>
                <a href="/" class="btn btn-warning">Return Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "{{ sale.ticket_code }}",
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
