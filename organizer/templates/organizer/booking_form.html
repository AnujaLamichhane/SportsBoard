{% load static %}
{% load crispy_forms_tags %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Tickets | {{ event.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'organizer/css/dashboard.css' %}">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-dark-card border-0 shadow-lg p-4">
                    <h2 class="text-warning mb-4">Confirm Your Booking</h2>

                    <div class="p-3 bg-dark rounded mb-4 border border-secondary">
                        <h5 class="mb-1 text-info">{{ event.name }}</h5>
                        <p class="small text-white mb-0"><i class="fas fa-calendar me-2"></i>{{ event.date_time|date:"M d, Y @ P" }}</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label class="form-label fw-bold">Select Ticket Tier</label>
                            {% for tier in event.ticket_tiers.all %}
                                <div class="form-check card bg-dark border-secondary p-3 mb-2">
                                    <input class="form-check-input" type="radio" name="ticket_tier" id="tier{{ tier.id }}" value="{{ tier.id }}" required>
                                    <label class="form-check-label d-flex justify-content-between w-100" for="tier{{ tier.id }}">
                                        <span>{{ tier.name }}</span>
                                        <span class="text-success fw-bold">NPR {{ tier.price }}</span>
                                    </label>
                                    <small class="text-white d-block mt-1">{{ tier.available_quantity }} spots remaining</small>
                                </div>
                            {% endfor %}
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" name="full_name" class="form-control bg-dark text-white border-secondary" required placeholder="Enter your full name">
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-3 fw-bold">
                            <i class="fas fa-check-circle me-2"></i>PROCEED TO PAYMENT
                        </button>
                        <a href="{% url 'organizer:event_detail' event.id %}" class="btn btn-link text-white w-100 mt-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
