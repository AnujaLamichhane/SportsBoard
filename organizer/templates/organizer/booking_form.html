{% load static %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets | {{ event.name }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-white: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary-blue: #3b82f6;
            --accent-yellow: #f59e0b;
            --success-green: #10b981;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .booking-container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
        }

        .booking-card {
            background: var(--bg-white);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .booking-title {
            color: var(--text-main);
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 25px 0;
            text-align: center;
        }

        /* Event Header */
        .event-mini-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .event-mini-box h5 {
            margin: 0 0 5px 0;
            color: var(--primary-blue);
            font-size: 1.1rem;
        }

        /* Ticket Tier Selection Styling */
        .tier-selection-list {
            margin-bottom: 25px;
        }

        .tier-item {
            display: block;
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tier-item:hover {
            border-color: var(--primary-blue);
        }

        /* Styling for the Radio Input inside Crispy/Custom loop */
        .tier-item input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .tier-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-weight: 700;
        }

        .price-text {
            color: var(--success-green);
        }

        /* Button Styling */
        .btn-pay {
            width: 100%;
            background-color: var(--accent-yellow);
            color: #000;
            padding: 16px;
            border-radius: 10px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-pay:hover {
            background-color: #d97706;
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Styling Crispy Form Inputs */
        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <div class="booking-card">
        <h2 class="booking-title">Confirm Your Booking</h2>

        <div class="event-mini-box">
            <h5>{{ event.name }}</h5>
            <p style="margin:0; font-size: 0.85rem; color: var(--text-muted);">
                <i class="fas fa-calendar-alt"></i> {{ event.date_time|date:"M d, Y @ P" }}
            </p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="tier-selection-list">
                <label style="font-weight: 700; display: block; margin-bottom: 12px;">Select Ticket Tier</label>
                {% for tier in event.ticket_tiers.all %}
                    <label class="tier-item" for="tier{{ tier.id }}">
                        <div style="display: flex; align-items: flex-start;">
                            <input type="radio" name="ticket_tier" id="tier{{ tier.id }}" value="{{ tier.id }}" required>
                            <div style="flex-grow: 1;">
                                <div class="tier-flex">
                                    <span>{{ tier.name }}</span>
                                    <span class="price-text">NPR {{ tier.price }}</span>
                                </div>
                                <small style="color: var(--text-muted);">{{ tier.available_quantity }} spots left</small>
                            </div>
                        </div>
                    </label>
                {% endfor %}
            </div>

            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-input" required placeholder="Enter your full name">
            </div>

            <div class="crispy-custom-wrapper">
                {{ form|crispy }}
            </div>

            <button type="submit" class="btn-pay">
                <i class="fas fa-check-circle"></i> PROCEED TO PAYMENT
            </button>

            <a href="{% url 'organizer:event_detail' event.id %}" class="btn-back">
                Cancel
            </a>
        </form>
    </div>
</div>

</body>
</html>
