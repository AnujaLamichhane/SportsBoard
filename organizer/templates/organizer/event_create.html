
{% load static %}
{% load crispy_forms_tags %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'organizer/css/dashboard.css' %}">

<template id="empty-ticket-tier-template">
    <div class="mb-3 p-2 border border-secondary rounded formset-item">
        {% include "organizer/ticket_type_form_snippet.html" with form=formset.empty_form %}
    </div>
</template>

<body class="bg-dark">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card bg-dark-card text-white p-4 shadow-lg">
                    <h2 class="text-white border-bottom pb-2 mb-4">{{ page_title }}</h2>

                    <form method="post" enctype="multipart/form-data" id="event-form">
                        {% csrf_token %}

                        {{ form|crispy }}

                        <h4 class="text-white border-bottom pb-2 mt-5 mb-3">Ticket Tiers & Pricing</h4>

                        {{ formset.management_form }}
                        <div id="ticket-formset-container">
                            {% for form in formset %}
                                <div class="mb-3 p-2 border border-secondary rounded formset-item">
                                    {{ form|crispy }}
                                </div>
                            {% endfor %}
                        </div>

                        <button type="button" class="btn btn-outline-warning mt-2 mb-4" id="add-ticket-tier">
                            <i class="fas fa-plus"></i> Add Another Ticket Tier
                        </button>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'organizer:dashboard' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning">
                                Create Event
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // -----------------------------------------------------------------
    // 1. Game Type Toggle Script (Existing and Correct)
    // -----------------------------------------------------------------
    const gameTypeSelect = document.getElementById('id_game_type');
    const otherFieldDiv = document.getElementById('div_id_game_type_other');

    function toggleOtherField() {
        if (gameTypeSelect.value === 'OTHER') {
            otherFieldDiv.style.display = 'block';
        } else {
            otherFieldDiv.style.display = 'none';
        }
    }

    toggleOtherField();
    gameTypeSelect.addEventListener('change', toggleOtherField);

    // -----------------------------------------------------------------
    // 2. Ticket Formset Management Script (CLEANED AND FIXED)
    // -----------------------------------------------------------------
    const $ = jQuery;
    const addTicketBtn = $('#add-ticket-tier');
    const formsetContainer = $('#ticket-formset-container');
    const managementForm = $('#id_tickettype_set-TOTAL_FORMS');

    // Get the HTML content from the template tag
    const emptyTemplate = $('#empty-ticket-tier-template').html();

    addTicketBtn.click(function() {
        let total = parseInt(managementForm.val());

        // 1. Replace the __prefix__ placeholder with the new index
        let newFormHtml = emptyTemplate.replace(/__prefix__/g, total);

        // 2. Wrap the new HTML and append to the container
        let newForm = $(newFormHtml);
        formsetContainer.append(newForm);

        // Optional: Hide the delete checkbox on the new form
        newForm.find('.form-check').hide();

        // 3. Increment the total forms count
        managementForm.val(total + 1);

        // 4. Scroll to the new form (optional UX improvement)
        newForm[0].scrollIntoView({ behavior: 'smooth', block: 'end' });
    });
});
</script>

</body>
