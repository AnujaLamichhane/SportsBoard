{% extends 'organizer/sidebar.html' %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex align-items-center mb-4">
                <i class="fas fa-question-circle fa-2x text-warning me-3"></i>
                <h2 class="text-white mb-0">Help & Feedback</h2>
            </div>

            <div class="card bg-dark-card border-secondary shadow-lg">
                <div class="card-body p-4">
                    <p class="text-muted">Have a question or found a bug? Let us know and our team will assist you.</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-white">Subject</label>
                            <input type="text" name="subject" class="form-control bg-dark border-secondary text-white" placeholder="What's on your mind?" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white">Category</label>
                            <select name="feedback_type" class="form-select bg-dark border-secondary text-white">
                                <option value="HELP">General Help</option>
                                <option value="ISSUE">Technical Issue / Bug</option>
                                <option value="FEATURE">Feature Request</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white">Message</label>
                            <textarea name="message" rows="5" class="form-control bg-dark border-secondary text-white" placeholder="Describe your issue or feedback in detail..." required></textarea>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-warning px-5 py-2 fw-bold">
                                <i class="fas fa-paper-plane me-2"></i>Submit Feedback
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mt-4 alert alert-info bg-info bg-opacity-10 border-info text-info">
                <i class="fas fa-info-circle me-2"></i>
                Emergency? You can also contact us directly at <strong>support@sportsboard.com.np</strong>
            </div>
        </div>
    </div>
</div>
{% endblock %}
