<div class="col">
    <div class="card bg-dark-card text-white p-3 shadow-lg">
        <div class="d-flex align-items-center">
            <i class="fas {{ icon }} h2 me-3 {{ color }}"></i>
            <div>
                <h5 class="card-title text-muted mb-0">{{ title }}</h5>
                <p class="h3 mb-0">{{ value }}</p>
                <small class="text-secondary">{{ description }}</small>
            </div>
        </div>
    </div>
</div>
