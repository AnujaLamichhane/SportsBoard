{% load static %}



<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confirm Delete</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{% static 'organizer/css/dashboard.css' %}">
</head>
<body class="bg-dark">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark-card text-white p-4 shadow-lg">
                <h2 class="text-danger border-bottom pb-2 mb-4">Confirm Deletion</h2>

                <p>Are you sure you want to delete the event:</p>
                <h3 class="text-warning mb-4">{{ event.name }} ?</h3>

                <div class="alert alert-danger" role="alert">
                    <strong>Warning:</strong> This action cannot be undone. All associated ticket sales, applications, and ticket tiers will also be deleted.
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'organizer:dashboard' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Confirm Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


</body>
</html>
