{% extends 'homepage/base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'organizer/css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'organizer/css/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'organizer/css/all_dash.css' %}">
    <style>
        /* This is the magic fix */
        .dashboard-main-wrapper {
            display: flex;          /* Places children side-by-side */
            align-items: stretch;
            width: 100%;
            min-height: 100vh;
            background-color: #f4f7f6;
            overflow-x: hidden;
            margin-top: 0px;
            padding-top: 0px;
            
        }

        .sidebar-container {
            width: 300px;       /* Set your desired width */
            min-width: 300px;
            flex-shrink: 0;     /* Prevents content from squishing the sidebar */
            background: #ffffff;
            border-right: 1px solid #ddd;
            height: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            top: 0;
            z-index: 100;
        }

        .content-right-area {
            flex-grow: 1;           /* Tells this part to take the remaining width */
            min-width: 0;           /* Crucial for preventing horizontal scroll */
            padding: 20px;
            background-color: #f4f7f6;
        }
    </style>
{% endblock %}

{% block content %}
<div class="dashboard-main-wrapper">
    <aside class="sidebar-container">
        {% include 'organizer/sidebar.html' %}
    </aside>

    <main class="content-right-area">
        <!-- <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 20px;">
             <span>Hello, <strong>{{ user.username }}</strong></span>
             <i class="fas fa-user-circle fa-2x" style="margin-left: 10px; color: #ccc;"></i>
        </div> -->

        {% include 'organizer/all_dash.html' %}
    </main>
</div>
{% endblock %}
{% block extra_js %}
    <script src="{% static 'organizer/js/slidebar.js' %}"></script>
    <script src="{% static 'organizer/js/charts.js' %}"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        function toggleSidebar() {
            document.getElementById('geminiSidebar').classList.toggle('sidebar-collapsed');
        }
    </script> -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('geminiSidebar');
            sidebar.classList.toggle('sidebar-collapsed');
        }
        const chartData = JSON.parse('{{ sales_data_json|safe }}');
    </script>


{% endblock %}
